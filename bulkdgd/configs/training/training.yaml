# Configuration file specifying the options to train the model.
#
# This configuration uses the 'tgmm' latent space implementation.


#######################################################################


# Set the number of epochs to train the model for.
#
# Type: int.
n_epochs: 200


#######################################################################


# Set the type of latent space.
#
# Type: str.
#
# Options: 'lgmm', 'tgmm'.
latent_type: tgmm


#######################################################################


# Set the reduction method to use for the loss function.
#
# Type: str.
#
# Options: 'sum', 'mean'.
loss_reduction_type: sum


#######################################################################


# Set the options for the data loader. They are passed to the
# 'torch.utils.data.DataLoader' constructor.
data_loader_options:

  # Set the options for the training data loader.
  train:

    # Set how many samples per batch to load.
    #
    # Type: int.
    batch_size: 64

    # Set whether to reshuffle the data during every training epoch.
    #
    # Type: bool.
    shuffle: True

  #-------------------------------------------------------------------#

  # Set the options for the test data loader.
  test:

    # Set how many samples per batch to load.
    #
    # Type: int.
    batch_size: 64

    # Set whether to reshuffle the data during every training epoch.
    #
    # Type: bool.
    shuffle: False


#######################################################################


# Set the options for reporting during training.
reporting_options:

  # Set the metrics to calculate on the latent space at each epoch.
  metrics:

    # Set the metrics to calculate for the latent space.
    #
    # Type: list of str.
    latent:
      - bic
      - silhouette_score
      - davies_bouldin_score
      - calinski_harabasz_score
      - adjusted_rand_index_score
      - adjusted_mutual_info_score

  #-------------------------------------------------------------------#

  # Set the options to report the loss.
  loss:

    # Set the options for the latent space loss.
    latent:

      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str. Options: 'none', 'n_samples'.
      norm_type: n_samples

    #-----------------------------------------------------------------#

    # Set the options for the reconstruction loss.
    decoder:

      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str. Options: 'none', 'n_samples'.
      norm_type: n_samples

    #-----------------------------------------------------------------#

    # Set the options for the total loss.
    total:

      # Set the method used to normalize the loss when reporting it
      # per epoch.
      #
      # Type: str. Options: 'none', 'n_samples'.
      norm_type: n_samples

  #-------------------------------------------------------------------#

  # Set the options for the optional outputs during training.
  optional_outputs:

    # Set the options for the model to save at each epoch.
    model_epoch:

      # Set whether to save the model at each epoch.
      #
      # Type: bool.
      enabled: False

      # Set the stride for saving the model at each epoch.
      #
      # Type: int.
      stride: 1

      # Set the directory for saving the model at each epoch.
      #
      # Type: str.
      dir: model_epoch

    #-----------------------------------------------------------------#

    # Set the options for the representations to save at each epoch.
    representations_epoch:

      # Set whether to save the representations at each epoch.
      #
      # Type: bool.
      enabled: True

      # Set the stride for saving the representations at each epoch.
      #
      # Type: int.
      stride: 1

      # Set the directory for saving the representations at each
      # epoch.
      #
      # Type: str.
      dir: representations

    #-----------------------------------------------------------------#

    # Set the options for the latent probabilities to save at each
    # epoch.
    latent_probs_epoch:

      # Set whether to save the latent probabilities at each epoch.
      #
      # Type: bool.
      enabled: True

      # Set the stride for saving the latent probabilities at each
      # epoch.
      #
      # Type: int.
      stride: 1

      # Set the directory for saving the latent probabilities at each
      # epoch.
      #
      # Type: str.
      dir: latent_probs

    #-----------------------------------------------------------------#

    # Set the options for the latent means to save at each epoch.
    latent_means_epoch:

      # Set whether to save the latent means at each epoch.
      #
      # Type: bool.
      enabled: True

      # Set the stride for saving the latent means at each epoch.
      #
      # Type: int.
      stride: 1

      # Set the directory for saving the latent means at each epoch.
      #
      # Type: str.
      dir: latent_means


#######################################################################


# Set the options to train the latent space (Gaussian mixture model).
latent_training_options:

  # Set the options for calculating the latent space loss.
  loss_calculation:

    # Set the weight of the latent space loss in the total loss.
    #
    # Type: float.
    lambda: 1.0

  #-------------------------------------------------------------------#

  # Set the options for fitting the GMM during training.
  fitting:

    # Set the epoch at which the Gaussian mixture model is first
    # fitted.
    #
    # Type: int.
    first_epoch: 25

    # Set whether to refit the Gaussian mixture model at the end of
    # training.
    #
    # Type: bool.
    refit_final: True

    # Set the interval (in epochs) at which the Gaussian mixture model
    # is refitted. Set to 0 to disable periodic refitting.
    #
    # Type: int.
    refit_interval: 0

    # Set the maximum number of EM iterations to perform at
    # 'first_epoch'.
    #
    # Type: int.
    max_iter_first_epoch: 1000

    # Set the maximum number of EM iterations at a full-refit epoch
    # (a multiple of 'refit_interval').
    #
    # Type: int.
    max_iter_full_refit: 100

    # Set the maximum number of EM iterations at a warm-refit epoch
    # (a later epoch that is not a full-refit epoch).
    #
    # Type: int.
    max_iter_warm_refit: 100

    # Set the maximum number of EM iterations at the final refit (if
    # 'refit_final' is True).
    #
    # Type: int.
    max_iter_final_refit: 1000

  #-------------------------------------------------------------------#

  # Set the type of removal of the collapsed components.
  #
  # Type: str or null.
  #
  # Options: 'weight_threshold', null.
  components_removal_type: null


#######################################################################


# Set the options to train the decoder.
decoder_training_options:

  # Set the optimizer.
  #
  # Type: str.
  #
  # Options: 'adam', 'adamw', 'lbfgs'.
  optimizer_type: adamw

  # Set the options for the optimizer.
  optimizer_options:

    # Set the learning rate.
    #
    # Type: float.
    lr: 0.01

    # Set the weight decay.
    #
    # Type: float.
    weight_decay: 0.1

    # Set the betas.
    #
    # Type: list of float.
    betas: [0.9, 0.999]

  #-------------------------------------------------------------------#

  # Set the norm the gradients are clipped to before the optimizer
  # takes its step.
  #
  # Type: float or null.
  grad_clipping_max_norm: 100000000.0

  #-------------------------------------------------------------------#

  # Set the type of learning rate scheduler.
  #
  # Type: str or null.
  #
  # Options: 'one_cycle', 'cosine', null.
  lr_scheduler_type: one_cycle

  # Set the options for the learning rate scheduler.
  lr_scheduler_options:

    # Ignored: a null 'lr_scheduler_type' disables the scheduler.
    #
    # Type: bool.
    enabled: True

    # Set the maximum learning rate.
    #
    # Type: float.
    max_lr: 0.01

    # Set the percentage of the cycle spent increasing the learning
    # rate.
    #
    # Type: float.
    pct_start: 0.25

    # Set the annealing strategy.
    #
    # Type: str.
    #
    # Options: 'cos', 'linear'.
    anneal_strategy: "cos"

    # Set whether the momentum is cycled inversely to learning rate
    # between 'base_momentum' and 'max_momentum'.
    #
    # Type: bool.
    cycle_momentum: True

    # Set the lower momentum boundaries in the cycle.
    #
    # Type: float.
    base_momentum: 0.85

    # Set the upper momentum boundaries in the cycle.
    #
    # Type: float.
    max_momentum: 0.9

    # Set the initial learning rate as max_lr/div_factor.
    #
    # Type: float.
    div_factor: 25.0

    # Set the final learning rate as max_lr/final_div_factor.
    #
    # Type: float.
    final_div_factor: 1000.0

    # Set whether to use a third phase of the schedule.
    #
    # Type: bool.
    three_phase: False


#######################################################################


# Set the options to train the representation layer (the
# representations found for the samples).
representations_training_options:

  # Set the type of noise to add to the representations during
  # training.
  #
  # Type: str. Options: 'none', 'gaussian'.
  train_noise_type: gaussian

  # Set the options for the noise to add to the representations during
  # training.
  train_noise_options:

    # Set the base noise scale. Set to 0.0 to disable noise injection.
    #
    # Type: float.
    scale: 0.1

    # Set the starting noise multiplier (at epoch 1).
    #
    # Type: float.
    start: 1.0

    # Set the ending noise multiplier (at the final epoch).
    #
    # Type: float.
    end: 0.01

    # Set the probability defining the hypersphere the noise is
    # normalized against.
    #
    # Type: float.
    within_radius_prob: 0.95

    # Set the final multiplier on the noise.
    #
    # Type: float.
    gain: 4.0

  #-------------------------------------------------------------------#

  # Set the optimizer.
  #
  # Type: str.
  #
  # Options: 'adam', 'adamw', 'lbfgs'.
  optimizer_type: adamw

  # Set the options for the optimizer.
  optimizer_options:

    # Set the learning rate.
    #
    # Type: float.
    lr: 0.01

    # Set the weight decay.
    #
    # Type: float.
    weight_decay: 0.0

    # Set the betas.
    #
    # Type: list of float.
    betas: [0.9, 0.999]

  #-------------------------------------------------------------------#

  # Set the norm the gradients are clipped to before the optimizer
  # takes its step.
  #
  # Type: float or null.
  grad_clipping_max_norm: 100000000.0

  #-------------------------------------------------------------------#

  # Set the type of learning rate scheduler.
  #
  # Type: str or null.
  #
  # Options: 'one_cycle', 'cosine', null.
  lr_scheduler_type: one_cycle

  # Set the options for the learning rate scheduler.
  lr_scheduler_options:

    # Ignored: a null 'lr_scheduler_type' disables the scheduler.
    #
    # Type: bool.
    enabled: True

    # Set the maximum learning rate.
    #
    # Type: float.
    max_lr: 0.01

    # Set the percentage of the cycle spent increasing the learning
    # rate.
    #
    # Type: float.
    pct_start: 0.25

    # Set the annealing strategy.
    #
    # Type: str.
    #
    # Options: 'cos', 'linear'.
    anneal_strategy: "cos"

    # Set whether the momentum is cycled inversely to learning rate
    # between 'base_momentum' and 'max_momentum'.
    #
    # Type: bool.
    cycle_momentum: True

    # Set the lower momentum boundaries in the cycle.
    #
    # Type: float.
    base_momentum: 0.85

    # Set the upper momentum boundaries in the cycle.
    #
    # Type: float.
    max_momentum: 0.9

    # Set the initial learning rate as max_lr/div_factor.
    #
    # Type: float.
    div_factor: 25.0

    # Set the final learning rate as max_lr/final_div_factor.
    #
    # Type: float.
    final_div_factor: 1000.0

    # Set whether to use a third phase of the schedule.
    #
    # Type: bool.
    three_phase: False


#######################################################################


# Set the type of early stopping to perform.
#
# Type: str or null.
#
# Options: 'loss', null.
early_stopping_type: null

# Set the options for early stopping.
early_stopping_options:

  # Set the number of epochs without improvement in the test loss
  # before stopping.
  #
  # Type: int.
  patience: 10


#######################################################################


# Set the options for the Gaussian mixture model fitted after
# training. Used only if the model has a 'gmm_final' section.
gmm_final_training_options:

  # Set which parameters the fit updates.
  #
  # Type: str.
  #
  # Options: 'covariance_only', 'full_em'.
  fit: covariance_only
