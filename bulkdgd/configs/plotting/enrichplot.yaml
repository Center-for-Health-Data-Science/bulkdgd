# This is a configuration file describing the aesthetics of a three-
# panels plot showing:
#
# - A bar plot of the number of genes of interest per group (for
#   instance, driver genes per cancer).
# - A violin plot of the distribution of genes of interest per group.
# - A strip plot of the enrichment scores.
#
#
# The file also contains the options specifying the format of the
# output file(s) where the plot will be saved.


#######################################################################


# Set the options for the output file.
#
# https://bulkdgd.readthedocs.io/en/latest/output.html
output:
  
  # Set the DPI (dots per inch) of the output file.
  #
  # Type: int.
  dpi: 900
  
  # Set whether the figure's background is transparent.
  #
  # Type: bool.
  transparent: True
  
  # Set the figure's bounding box in inches.
  #
  # Type: str.
  #
  # Options: 'standard' or 'tight'.
  bbox_inches: tight


#######################################################################


# Set the options for the figure.
figure:

  # Set the options to adjust the sub-plots.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  subplots:

    # Set the horizontal space between the sub-plots.
    #
    # Type: int or float.
    wspace: 0.5

    # Set the vertical space between the sub-plots.
    #
    # Type: int or float.
    hspace: 0.5
  
  # Set the size of the figure in inches.
  #
  # Type: list of floats.
  sizeinches: [30, 15]


#######################################################################


# The general font properties.
#
# https://bulkdgd.readthedocs.io/en/latest/text_elements.html
general_fontproperties:

  # Set the name of/path to the font.
  #
  # Type: str.
  #
  # Notes: if !!null, Matplotlib's default font is used.
  fname: !!null


#######################################################################


# The palette to be used for the groups in all three panels.
#
# Type: str.
#
# Options: https://bulkdgd.readthedocs.io/en/latest/colors.html.
general_palette: husl


#######################################################################


# Set the options for the violin plot.
#
# https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
violinplot:

  # The distance, in units of bandwidth, to extend the density past
  # the extreme data points.
  #
  # Type: int or float.
  cut: 0.0

  # The method that normalizes each density to set the violin's width.
  #
  # Type: str.
  #
  # Options: 'area', 'count' or 'width'.
  density_norm: area

  # The representation of the data in the violin's interior.
  #
  # Type: str.
  #
  # Options: 'box', 'quartiles', 'point', 'stick' or !!null (none).
  inner: !!null

  # The color of the violin's lines.
  #
  # Type: str.
  #
  # Options: https://bulkdgd.readthedocs.io/en/latest/colors.html.
  linecolor: "#333333"


#######################################################################


# Set the options for the x-axis. This axis is shared between the 
# three panels.
xaxis:
  
  # Set the options for the axis' label.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  label:

    # Set the label.
    #
    # Type: str.
    xlabel: Dataset

    # Set the padding around the label.
    #
    # Type: int.
    labelpad: 10

    # Set the font properties of the label.
    fontproperties:

      # Set the font size.
      #
      # Type: int.
      size: 22

  #-------------------------------------------------------------------#
  
  # Set the axis' ticks' labels.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  ticklabels:
    
    # Set the options for the ticks' labels.
    options:
      
      # The text's rotation angle (in degrees) in a counterclockwise
      # direction.
      #
      # Type: int or float.
      rotation: 0

      # Set the font properties of the ticks' labels.
      fontproperties:

        # Set the font size.
        #
        # Type: int.
        size: 18


#######################################################################


# The options to be used for the y-axis of all three plots.
yaxis:

  # Set the options for the axis' label.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  label:

    # Set the padding around the label.
    #
    # Type: int.
    labelpad: 10

    # Set the font properties of the label.
    fontproperties:

      # Set the font size.
      #
      # Type: int.
      size: 22

  #-------------------------------------------------------------------#

  # Set the axis' ticks' labels.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  ticklabels:

    # Set the options for the ticks' labels.
    options:

      # Set the font properties of the ticks' labels.
      fontproperties:

        # Set the font size.
        #
        # Type: int.
        size: 18


#######################################################################


# Set the options for the y-axis of the bar plot.
yaxis_barplot:
  
  # Set the options for the axis' label.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  label:

    # Set the label.
    #
    # Type: str.
    ylabel: "Number of\ngenes of interest"

  #-------------------------------------------------------------------#

  # Set the options for the interval represented on the axis.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  interval:

    # Set the type of interval represented on the axis.
    #
    # Type: str.
    #
    # Options: 'discrete' or 'continuous'.
    type: discrete

    # Set the multiple to round the ticks' positions to.
    #
    # Type: int or float.
    # round_to_nearest: !!null

    # Set the highest value displayed on the axis.
    #
    # Type: int or float.
    top: 100

    # Set the lowest value displayed on the axis.
    #
    # Type: int or float.
    bottom: 0

    # Set the number of steps (ticks) on the axis, extremes included.
    #
    # Type: int.
    # steps: !!null

    # Set the spacing between the ticks on the axis.
    #
    # Type: int or float.
    spacing: 20


#######################################################################


# Set the options for the y-axis of the violin plot.
yaxis_violinplot:
  
  # Set the options for the axis' label.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  label:

    # Set the label.
    #
    # Type: str.
    ylabel: "Number of\nsignificant genes"

  #-------------------------------------------------------------------#

  # Set the options for the interval represented on the axis.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  interval:

    # Set the type of interval represented on the axis.
    #
    # Type: str.
    #
    # Options: 'discrete' or 'continuous'.
    type: discrete

    # Set the multiple to round the ticks' positions to.
    #
    # Type: int or float.
    # round_to_nearest: !!null

    # Set the highest value displayed on the axis.
    #
    # Type: int or float.
    top: 500

    # Set the lowest value displayed on the axis.
    #
    # Type: int or float.
    bottom: 0

    # Set the number of steps (ticks) on the axis, extremes included.
    #
    # Type: int.
    # steps: !!null

    # Set the spacing between the ticks on the axis.
    #
    # Type: int or float.
    spacing: 100


#######################################################################


# Set the options for the y-axis of the strip plot.
yaxis_stripplot:
  
  # Set the options for the axis' label.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  label:

    # Set the label.
    #
    # Type: str.
    ylabel: "Enrichment score"

  #-------------------------------------------------------------------#

  # Set the options for the interval represented on the axis.
  #
  # https://bulkdgd.readthedocs.io/en/latest/violin_plots.html
  interval:

    # Set the type of interval represented on the axis.
    #
    # Type: str.
    #
    # Options: 'discrete' or 'continuous'.
    type: continuous

    # Set the multiple to round the ticks' positions to.
    #
    # Type: int or float.
    # round_to_nearest: !!null

    # Set the highest value displayed on the axis.
    #
    # Type: int or float.
    top: 20.0

    # Set the lowest value displayed on the axis.
    #
    # Type: int or float.
    bottom: 0.0

    # Set the number of steps (ticks) on the axis, extremes included.
    #
    # Type: int.
    # steps: !!null

    # Set the spacing between the ticks on the axis.
    #
    # Type: int or float.
    spacing: 5.0


#######################################################################
  
# The options for drawing a horizontal line on the strip plot.
#
# https://bulkdgd.readthedocs.io/en/latest/strip_plots.html
hline_stripplot:

  # Set the y-coordinate of the horizontal line.
  #
  # Type: int or float.
  y: 0.0

  # Set the style of the line.
  #
  # Type: str or tuple.
  #
  # Options: '-', '--', '-.', ':' or an (offset, dashes) tuple.
  linestyle: --

  # Set how to draw the end caps if the lines are dashed.
  #
  # Type: str.
  #
  # Options: 'butt', 'round' or 'projecting'.
  dash_capstyle: round

  # Set how to join line segments if the lines are dashed.
  #
  # Type: str.
  #
  # Options: 'miter', 'round' or 'bevel'.
  dash_joinstyle: round

  # Set the color of the line.
  #
  # Type: str or float.
  #
  # Options: https://bulkdgd.readthedocs.io/en/latest/colors.html
  color: "#333333"